spring.application.name=project-injection-service

server.port=8080

# MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/product_db
spring.data.mongodb.auto-index-creation=true

# Kafka Consumer
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=product-ingestion-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.ecommerce.project_injection_service.dto.ProductMessageDto
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false

# Application Kafka Topics & Retry Settings
app.kafka.topics.in=products.in
app.kafka.topics.dlq=products.dlq
app.kafka.retry.max-attempts=3
app.kafka.retry.backoff-ms=1000

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging
logging.level.root=WARN
logging.level.com.ecommerce=INFO
